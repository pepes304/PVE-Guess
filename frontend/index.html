<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordle Українською</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">
  <header class="w-full max-w-6xl mb-4 sm:mb-6 flex flex-col sm:flex-row items-center justify-between gap-2 sm:gap-3">
    <h1 class="text-2xl sm:text-3xl font-bold text-white">🇺🇦 WORDLE</h1>
    <div class="flex flex-wrap items-center justify-center sm:justify-end gap-1 sm:gap-2">
      <div id="profileInfo" class="text-white text-xs sm:text-sm"></div>
      <button id="btnLogin" class="px-2 sm:px-4 py-1 sm:py-2 bg-blue-600 text-white rounded text-xs sm:text-sm">Увійти</button>
      <button id="btnRegister" class="px-2 sm:px-4 py-1 sm:py-2 bg-indigo-600 text-white rounded text-xs sm:text-sm">Реєстрація</button>
      <button id="btnLogout" class="px-2 sm:px-4 py-1 sm:py-2 bg-red-600 text-white rounded text-xs sm:text-sm hidden">Вийти</button>
    </div>
  </header>

  <div id="message" class="h-6 sm:h-8 mb-2 sm:mb-4 text-white text-sm sm:text-lg font-semibold"></div>
  
  <div id="grid" class="grid grid-rows-6 gap-1 sm:gap-1.5 mb-4 sm:mb-6"></div>
  
  <div id="keyboard" class="flex flex-col gap-1"></div>
  
  <button id="newGame" class="mt-4 sm:mt-6 px-4 sm:px-6 py-1.5 sm:py-2 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition hidden text-sm sm:text-base">
    Нова гра
  </button>

  <script>
    window.__API_BASE__ = 'http://0.0.0.0:8080';
  </script>
  <script src="js/main.js" type="module"></script>
  <script src="js/game.js" type="module"></script>
</body>
</html>
